{% extends "base.html" %}
{% block content %}

<section class="payment-page">
    <div class="payment-box">
        <h2>Checkout</h2>
        <p class="total">
            Cart Total: ₹{{ cart_total }}<br>
            Shipping: 
            {% if shipping == 0 %}
                Free
            {% else %}
                ₹{{ shipping }}
            {% endif %}
            <br>
            Grand Total: ₹{{ grand_total }}
        </p>

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="full_name" placeholder="Full Name" required>
            <input type="text" name="phone" placeholder="Phone Number" required>

            <input type="email" name="email" value="{{ user_email }}" placeholder="Email Address" required>

            <textarea name="address" placeholder="Delivery Address" required></textarea>
            <input type="text" name="city" placeholder="City" required>
            <input type="text" name="pincode" placeholder="Pincode" required>

            <h3>Choose Payment Method</h3>

            <label class="payment-option">
                <input type="radio" name="payment_method" value="Online Payment" required>
                Online Payment
            </label>

            <label class="payment-option">
                <input type="radio" name="payment_method" value="Cash on Delivery" required>
                Cash on Delivery
            </label>

            <button type="submit">Place Order</button>
        </form>
    </div>
</section>

<style>
.payment-page {
    padding: 80px 20px;
    background: #fff7f2;
}

.payment-box {
    max-width: 520px;
    margin: auto;
    background: #fff;
    padding: 35px;
    border-radius: 22px;
    box-shadow: 0 12px 35px rgba(59, 8, 4, 0.12);
}

.payment-box h2 {
    color: #3b0804;
    text-align: center;
    font-size: 34px;
}

.total {
    text-align: center;
    font-size: 20px;
    color: #fb6f83;
    font-weight: 700;
    margin-bottom: 25px;
}

.payment-box input,
.payment-box textarea {
    width: 100%;
    padding: 14px;
    margin-bottom: 14px;
    border: 1px solid #f2c7bd;
    border-radius: 12px;
    font-size: 15px;
}

.payment-box textarea {
    height: 90px;
    resize: none;
}

.payment-box h3 {
    color: #3b0804;
    margin: 15px 0;
}

.payment-option {
    display: block;
    background: #fff1eb;
    padding: 13px;
    margin-bottom: 12px;
    border-radius: 12px;
    color: #3b0804;
    font-weight: 600;
}

.payment-option input {
    width: auto;
    margin-right: 8px;
}

.payment-box button {
    width: 100%;
    padding: 15px;
    background: #fb6f83;
    color: white;
    border: none;
    border-radius: 30px;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
}
</style>

{% endblock %}
