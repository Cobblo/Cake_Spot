{% extends 'base.html' %}

{% block title %}Login | Cake Spot{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-box">
        <h2>Login</h2>
        <p>Welcome back to Cake Spot.</p>

        <form method="POST">
            {% csrf_token %}

            <input type="email"
                   name="email"
                   placeholder="Email Address"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <div class="forgot-password">
                <a href="{% url 'password_reset' %}">
                    Forgot Password?
                </a>
            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <p class="auth-link">
            Don’t have an account?
            <a href="{% url 'signup' %}">Signup</a>
        </p>

    </div>
</section>

{% endblock %}
