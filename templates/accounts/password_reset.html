{% extends 'base.html' %}

{% block title %}Forgot Password | Cake Spot{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-box">
        <h2>Forgot Password</h2>
        <p>Enter your registered email address.</p>

        <form method="POST">
            {% csrf_token %}

            <input type="email"
                   name="email"
                   placeholder="Email Address"
                   required>

            <button type="submit">
                Send Reset Link
            </button>
        </form>

        <p class="auth-link">
            Remember password?
            <a href="{% url 'login' %}">Login</a>
        </p>
    </div>
</section>

{% endblock %}
