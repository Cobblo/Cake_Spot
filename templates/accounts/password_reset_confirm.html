{% extends 'base.html' %}

{% block content %}
<section class="auth-section">
    <div class="auth-box">

        <h2>Set New Password</h2>

        <form method="POST">
            {% csrf_token %}
            {{ form.new_password1 }}
            {{ form.new_password2 }}

            <button type="submit">
                Update Password
            </button>
        </form>

    </div>
</section>
{% endblock %}
